name: Verify release pointer (reusable)

# Reusable validation for version.yaml — the release pointer that selects the
# published image a service deploys. Three fail-closed gates:
#   1. schema    — exactly `release: {branch, sha}`;
#   2. provenance — the sha resolves to a commit reachable from its branch;
#   3. existence — an image tagged with that exact sha is already published.
#
# Call from a pull_request workflow so every pointer PR carries the status:
#
#   permissions: { contents: read, id-token: write }
#   jobs:
#     verify:
#       uses: ton-connect/ci/.github/workflows/verify-release-pointer.yml@main
#       with:
#         ecr-repository: <service>
#         role-arn: arn:aws:iam::<account>:role/gha-ecr-read-<service>
#
# The role must be read-only and assumable only from pull_request events of the
# calling repository: fork PRs cannot mint the OIDC token, so pointer changes
# from forks fail closed and must be re-raised by a maintainer.

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-arn:
        description: Read-only OIDC role for the ECR existence check
        required: true
        type: string
      aws-region:
        description: ECR region
        required: false
        type: string
        default: eu-central-1

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ inputs.aws-region }}
      ECR_REPOSITORY: ${{ inputs.ecr-repository }}
      ROLE_ARN: ${{ inputs.role-arn }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for ancestry checks

      - name: Detect version.yaml change
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }} # pass via env, never inline in run:
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if [ -n "$(git diff --name-only "origin/$BASE_REF...HEAD" -- version.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version.yaml untouched; nothing to verify."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate schema
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Exactly one top-level key `release`, with exactly `branch` + `sha`.
          KEYS=$(yq -r '. | keys | join(",")' version.yaml)
          [ "$KEYS" = "release" ] || { echo "::error::version.yaml must have exactly one top-level key 'release' (got: $KEYS)"; exit 1; }
          RKEYS=$(yq -r '.release | keys | sort | join(",")' version.yaml)
          [ "$RKEYS" = "branch,sha" ] || { echo "::error::release must have exactly 'branch' and 'sha' (got: $RKEYS)"; exit 1; }

          BRANCH=$(yq -r '.release.branch' version.yaml)
          SHA=$(yq -r '.release.sha' version.yaml)
          # Default branch name differs across services (main/master); provenance
          # below is the real branch gate, this only rejects malformed refs.
          echo "$BRANCH" | grep -Eq '^(main|master|release/[^/]+)$' || { echo "::error::release.branch must match ^(main|master|release/[^/]+)$ (got: $BRANCH)"; exit 1; }
          echo "$SHA" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "::error::release.sha must be a 7-40 char hex commit id (got: $SHA)"; exit 1; }

          # Export for downstream steps.
          {
            echo "RELEASE_BRANCH=$BRANCH"
            echo "RELEASE_SHA=$SHA"
          } >> "$GITHUB_ENV"

      - name: Verify provenance
        if: steps.changed.outputs.changed == 'true'
        run: |
          # The pointed sha must resolve to a commit AND be reachable from its branch.
          # Fetch the branch first so a missing branch and a sha that is simply not
          # on the branch fail with distinct, actionable errors.
          git fetch --no-tags origin "${RELEASE_BRANCH}" \
            || { echo "::error::release.branch does not exist on origin: ${RELEASE_BRANCH}"; exit 1; }
          git rev-parse --verify "${RELEASE_SHA}^{commit}" >/dev/null 2>&1 \
            || { echo "::error::release.sha does not resolve to a commit: ${RELEASE_SHA}"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/${RELEASE_BRANCH}" \
            || { echo "::error::sha not reachable from branch"; exit 1; }

      - name: Configure AWS credentials
        if: steps.changed.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify published image exists
        if: steps.changed.outputs.changed == 'true'
        run: |
          # Load-bearing gate: the release pointer must reference an image that
          # has actually been published. Tag is the exact sha string from the file.
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$RELEASE_SHA" >/dev/null 2>&1 \
            || { echo "::error::no published image for this sha"; exit 1; }
          echo "Published image found for $RELEASE_SHA."
