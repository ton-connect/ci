name: check-release-policy

# Runs `release-resolver check` from ECR on a pull request and annotates each refusal on its file.
# A PR that changes no release file passes unchecked; a fork PR that changes one fails at credentials.
#
#   permissions: { contents: read, id-token: write }
#   jobs:
#     release-policy:
#       uses: ton-connect/ci/.github/workflows/check-release-policy.yml@main
#       with:
#         service: <catalog key>

on:
  workflow_call:
    inputs:
      service:
        description: "Catalog key of the service = gha-ecr-read-<service> role suffix."
        required: true
        type: string

env:
  # The release-resolver commit the check runs, so it judges by the rules the resolver applies.
  # Move it only after the prod Deployment runs the new commit.
  RESOLVER_IMAGE: 990678687129.dkr.ecr.eu-central-1.amazonaws.com/release-resolver:dce154b8b2274ab0bd21645af1149b663ccc03d8

jobs:
  release-policy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The later steps skip and the job stays green: a required check must report on every PR.
      - name: Detect release file changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull_request.base.sha is empty; call this workflow from a pull_request event"
            exit 1
          fi
          files="$(git diff --name-only "$BASE_SHA...HEAD" -- version.yaml service.yaml service.staging.yaml)"
          if [ -n "$files" ]; then
            echo "$files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release files unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Name the effect of the merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          v="$(git show "$BASE_SHA:version.yaml" 2>/dev/null || true)"
          branch="$(printf '%s\n' "$v" | awk '/^[^ #]/ { top = $1 } top == "prod:" && $1 == "branch:" { gsub(/"/, "", $2); print $2; exit }')"
          [ -n "$branch" ] || branch="$(printf '%s\n' "$v" | sed -n 's/^prod:[[:space:]]*{.*branch:[[:space:]]*"\{0,1\}\([^",} ]*\).*/\1/p')"
          if [ "$branch" = "$BASE_REF" ]; then
            msg="merging this pull request deploys prod: version.yaml on $BASE_REF declares prod: {branch: $BASE_REF}"
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure credentials
        if: steps.changed.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::990678687129:role/gha-ecr-read-${{ inputs.service }}
          aws-region: eu-central-1

      - name: Log in to registry
        if: steps.changed.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check release policy
        if: steps.changed.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          check() {
            docker run --rm -v "$PWD:/src:ro" \
              -e GITHUB_TOKEN -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
              "$RESOLVER_IMAGE" check --dir /src --org "$OWNER" --repo "$REPO" \
              --default-branch "$DEFAULT_BRANCH" --base-sha "$BASE_SHA"
          }
          if check; then exit 0; else rc=$?; fi
          [ "$rc" -eq 2 ] || exit "$rc"
          echo "the check could not judge (exit 2), one retry"
          check
