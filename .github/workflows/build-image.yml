name: Build image (reusable)

# Reusable image build for TON Connect services: build the service's container
# image once per commit and publish it to ECR, tagged with the full commit sha.
# Callers say WHICH repository/role/dockerfile; this workflow owns HOW images are
# built, so the logic lives in one place.
#
# Call from a push-only workflow — OIDC credentials must never be mintable from
# fork pull requests, so callers must not use pull_request triggers:
#
#   permissions: { id-token: write, contents: read }
#   jobs:
#     build:
#       uses: ton-connect/ci/.github/workflows/build-image.yml@main
#       with:
#         ecr-repository: <service>
#         role-arn: arn:aws:iam::<account>:role/gha-ecr-push-<service>
#
# Services that test the built image add their own job between checkout and the
# call, or gate deployment on a separate test workflow — this workflow only
# builds and publishes.

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-arn:
        description: OIDC role with push access to the ECR repository
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      runner:
        description: Runner label; service images are arm64 by default
        required: false
        type: string
        default: ubuntu-24.04-arm
      aws-region:
        description: ECR region
        required: false
        type: string
        default: eu-central-1

# Serialize same-(repository,sha) runs into one lane so a push and a
# workflow_dispatch of the SAME commit do not both build and race on the immutable
# tag. Under workflow_call github.sha is the CALLER's commit. cancel-in-progress:
# false lets the in-flight push finish; the queued duplicate then hits the
# pre-check and skips.
concurrency:
  group: build-${{ inputs.ecr-repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    env:
      AWS_REGION: ${{ inputs.aws-region }}
      ECR_REPOSITORY: ${{ inputs.ecr-repository }}
      ROLE_ARN: ${{ inputs.role-arn }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      BUILD_CONTEXT: ${{ inputs.context }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The registry host is the role's account in the build region — derived, so
      # callers never repeat their account id.
      - name: Derive registry
        run: |
          ACCOUNT_ID="$(echo "$ROLE_ARN" | cut -d: -f5)"
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      # Image tags are immutable: re-running a build for an already-published sha is
      # a success, not a failure.
      - name: Check for existing image
        id: guard
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag $GITHUB_SHA already published; skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        if: steps.guard.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # provenance/sbom attestations off so the pushed artifact is a plain
      # single-arch manifest, not an OCI image index.
      - name: Build image
        if: steps.guard.outputs.exists != 'true'
        run: |
          docker build \
            --provenance=false \
            --sbom=false \
            -f "$DOCKERFILE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            "$BUILD_CONTEXT"

      - name: Push the sha tag (state-based idempotency on immutable-tag collision)
        if: steps.guard.outputs.exists != 'true'
        run: |
          push_idempotent() {
            local tag="$1" ref out rc
            ref="$ECR_REGISTRY/$ECR_REPOSITORY:$tag"
            # GH Actions runs run: under `bash -eo pipefail`; a bare out=$(cmd) exits
            # the step the instant the push fails, before we can read rc. An
            # if-guarded assignment is exempt from errexit.
            if out="$(docker push "$ref" 2>&1)"; then rc=0; else rc=$?; fi
            echo "$out"
            [ "$rc" -eq 0 ] && return 0
            # The only tolerated failure is a concurrent run already landing this
            # exact immutable tag. ECR prints no CamelCase token for that, so decide
            # by STATE, not message text: if the tag is now present, the artifact we
            # wanted is there.
            if aws ecr describe-images \
                 --repository-name "$ECR_REPOSITORY" \
                 --image-ids imageTag="$tag" >/dev/null 2>&1; then
              echo "Tag $tag already present in ECR (concurrent push); treating as success."
              return 0
            fi
            echo "docker push failed and tag $tag is absent from ECR; failing." >&2
            return "$rc"
          }
          push_idempotent "$GITHUB_SHA"
