name: Re-tag image (reusable)

# Add an extra tag to an image that is ALREADY in ECR — a manifest copy, no
# rebuild, no pull. Companion to build-image.yml for commits that build nothing:
# a version.yaml release-pointer bump (and docs-only commits) publish no image,
# but the staging deploy HEAD-tracks the commit sha and would sit in
# ImagePullBackOff forever waiting for an image that never comes. So we copy the
# already-published source-tag manifest onto the new commit sha; staging then
# resolves to exactly the released image.
#
# Same OIDC-push contract as build-image.yml — call from a push-only workflow so
# fork pull requests can never mint the credentials:
#
#   permissions: { id-token: write, contents: read }
#   jobs:
#     retag:
#       uses: ton-connect/ci/.github/workflows/retag-image.yml@main
#       with:
#         ecr-repository: <service>
#         role-arn: arn:aws:iam::<account>:role/gha-ecr-push-<service>
#         source-tag: <existing tag, e.g. the release-pointer sha>
#         new-tag: ${{ github.sha }}

on:
  workflow_call:
    inputs:
      ecr-repository:
        description: ECR repository name
        required: true
        type: string
      role-arn:
        description: OIDC role with push access to the ECR repository
        required: true
        type: string
      source-tag:
        description: Existing image tag to copy from (e.g. the release-pointer sha)
        required: true
        type: string
      new-tag:
        description: Tag to add onto the same manifest (e.g. the commit sha)
        required: true
        type: string
      runner:
        description: Runner label; a plain awscli job, arch-agnostic
        required: false
        type: string
        default: ubuntu-latest
      aws-region:
        description: ECR region
        required: false
        type: string
        default: eu-central-1

jobs:
  retag:
    runs-on: ${{ inputs.runner }}

    env:
      AWS_REGION: ${{ inputs.aws-region }}
      ECR_REPOSITORY: ${{ inputs.ecr-repository }}
      ROLE_ARN: ${{ inputs.role-arn }}
      SOURCE_TAG: ${{ inputs.source-tag }}
      NEW_TAG: ${{ inputs.new-tag }}

    steps:
      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Tags are immutable; if new-tag already resolves the re-tag is already done
      # (a re-run, or build-image won the race for a mixed commit) — short-circuit.
      - name: Skip if new-tag already exists
        id: guard
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already present in $ECR_REPOSITORY; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Copy the source manifest onto new-tag. batch-get-image reads the existing
      # manifest (and its media type); put-image writes it back under new-tag. The
      # image digest is unchanged, so new-tag and source-tag share one image.
      - name: Re-tag manifest
        if: steps.guard.outputs.exists != 'true'
        run: |
          MANIFEST="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" \
            --query 'images[0].imageManifest' --output text)"
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "::error::source tag $SOURCE_TAG not found in $ECR_REPOSITORY — the release pointer references an unbuilt image"
            exit 1
          fi
          MEDIA_TYPE="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" \
            --query 'images[0].imageManifestMediaType' --output text)"
          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$NEW_TAG" \
            --image-manifest "$MANIFEST" \
            --image-manifest-media-type "$MEDIA_TYPE" >/dev/null
          echo "Re-tagged $ECR_REPOSITORY:$SOURCE_TAG -> +$NEW_TAG"
